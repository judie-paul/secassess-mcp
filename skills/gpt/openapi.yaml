# Actions schema for a custom GPT. Matches the FastAPI routes in api/routes/organizations.py.
# The deployed API also serves its full generated schema at /openapi.json.
# Set the server URL to the deployment. Add authentication (API key header) before
# exposing the API publicly; the demo API runs without it.
openapi: 3.1.0
info:
  title: secassess API
  version: "1.0"
  description: Read-only access to cloud security findings, data inventory and sign-in logs, plus assessment generation.
servers:
  - url: https://YOUR-DEPLOYMENT.example.com
components:
  parameters:
    org:
      name: organization_id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
      description: Organization ID, e.g. org-001
  schemas:
    AssessmentRequest:
      type: object
      properties:
        top_risks_limit: { type: integer, minimum: 5, maximum: 7, default: 5 }
        annotations:
          type: array
          description: AI-written text per top risk. Must not contain numbers that are not in the data.
          items:
            type: object
            required: [risk_id, business_impact, remediation]
            properties:
              risk_id: { type: string, example: R-001 }
              business_impact: { type: string, maxLength: 400 }
              remediation: { type: string, maxLength: 400 }
paths:
  /organizations/{organization_id}/summary:
    get:
      operationId: getSummary
      summary: Overall posture - totals, severity split, findings by service, risk matrix
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses: { "200": { description: Summary } }
  /organizations/{organization_id}/risks:
    get:
      operationId: getTopRisks
      summary: Highest-priority risks with score breakdown and evidence
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: limit, in: query, schema: { type: integer, minimum: 5, maximum: 7, default: 5 } }
      responses: { "200": { description: Ranked risks } }
  /organizations/{organization_id}/findings:
    get:
      operationId: listFindings
      summary: Configuration findings, most severe first
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: severity, in: query, schema: { type: string, enum: [critical, high, medium, low] } }
        - { name: service, in: query, schema: { type: string }, description: "e.g. S3, IAM, RDS" }
        - { name: status, in: query, schema: { type: string } }
        - { name: asset_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: Findings page } }
  /organizations/{organization_id}/assets/{asset_id}:
    get:
      operationId: getAsset
      summary: Everything known about one asset across all data sources
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Asset detail }
        "404": { description: Unknown asset }
  /organizations/{organization_id}/data-inventory:
    get:
      operationId: getDataInventory
      summary: Where sensitive data is stored (null record count = unknown)
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: asset_id, in: query, schema: { type: string } }
        - { name: sensitivity, in: query, schema: { type: string } }
        - { name: contains_pii, in: query, schema: { type: boolean } }
        - { name: contains_financial_data, in: query, schema: { type: boolean } }
      responses: { "200": { description: Data inventory } }
  /organizations/{organization_id}/auth-logs:
    get:
      operationId: queryAuthLogs
      summary: Sign-in and access events, newest first
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: username, in: query, schema: { type: string } }
        - { name: asset_id, in: query, schema: { type: string } }
        - { name: source_ip, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string }, description: "Country name or ISO code" }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: start_time, in: query, schema: { type: string, format: date-time } }
        - { name: end_time, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: Events page } }
  /organizations/{organization_id}/anomalies:
    get:
      operationId: getAnomalies
      summary: Suspicious activity flagged by detection rules
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: anomaly_type, in: query, schema: { type: string } }
        - { name: asset_id, in: query, schema: { type: string } }
        - { name: start_time, in: query, schema: { type: string, format: date-time } }
        - { name: end_time, in: query, schema: { type: string, format: date-time } }
      responses: { "200": { description: Anomalies } }
  /organizations/{organization_id}/assessments:
    post:
      operationId: createAssessment
      summary: Create the assessment report data (all figures, plus your per-risk text)
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentRequest" }
      responses:
        "201": { description: Assessment report data }
        "422": { description: Request rejected }
