[project]
name = "secassess-mcp"
version = "0.1.0"
description = "AI security assessment agent: MCP tools over cloud security data, plus PowerPoint/PDF reporting"
requires-python = ">=3.11"
dependencies = [
    # Part A (backend, MCP server, scoring)
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "mcp>=2.3,<3.0",
    "tzdata>=2024.1",  # IANA time zone data; Windows has no system tz database for zoneinfo
    # Part B (reporting)
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = [
    "reporting",
    "reporting.template",
    "api",
    "api.data_access",
    "api.routes",
    "api.schemas",
    "api.services",
    "analysis",
    "data",
    "mcp_server",
    "mcp_server.tools",
]
py-modules = ["config"]

[tool.setuptools.package-data]
data = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
